---
layout: default
---
<article class="post-detail">
  <header class="post-header" style="margin-bottom: 2rem;">
    <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">{{ page.title }}</h1>
    <div style="color: #64748b; font-size: 0.95rem;">
      <span><i class="fa-regular fa-calendar"></i> {{ page.date | date: "%Y년 %m월 %d일" }}</span>
      <span style="margin-left: 1rem;"><i class="fa-solid fa-folder-open"></i> {{ page.category | default: "Codyssey Mission" }}</span>
    </div>
  </header>

  <div class="post-content" style="background: white; padding: 2rem; border-radius: 0.85rem; border: 1px solid #e2e8f0; font-size: 1.05rem; line-height: 1.8;">
    {{ content }}
  </div>

  <div style="margin-top: 2rem;">
    <a href="{{ '/' | relative_url }}" class="read-more">← 전체 글 목록으로 돌아가기</a>
  </div>
</article>
